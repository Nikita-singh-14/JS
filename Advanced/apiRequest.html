<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api Request</title>
</head>
<body style="background-color: #212121; color: white;">
    <p>
        Value	State	Description <hr>
0	UNSENT	Client has been created. open() not called yet.<hr>
1	OPENED	open() has been called. <hr>
2	HEADERS_RECEIVED	send() has been called, and headers and status are available. <hr>
3	LOADING	Downloading; responseText holds partial data. <hr>
4	DONE	The operation is complete.
    </p>
</body>
<script>
    const reqURL = "https://api.github.com/users/Nikita-singh-14";
    const body = document.querySelector('body')
    const div = document.createElement('div')
    body.appendChild(div)


    const xhr = new XMLHttpRequest();
    xhr.open('GET', reqURL)
    xhr.onreadystatechange = function(){
    console.log(xhr.readyState);
    if(xhr.readyState === 4){
        //console.log(xhr.responseText);
        const data = JSON.parse(this.responseText)
        // console.log(typeof data)
        console.log(data.followers)
        const button = document.createElement('button');
        button.innerHTML = 'view my profile'
        body.appendChild(button)
        button.addEventListener('click', function () {
            console.log(data.avatar_url)
            console.log(data.followers)
            const img = document.createElement('img');
            img.src = data.avatar_url;
            img.style.width = "100px"
            div.appendChild(img)

            const follower = document.createElement('h2');
            follower.innerText = data.followers;
            div.appendChild(follower)

        })
    }
}
xhr.send();
</script>
</html>
